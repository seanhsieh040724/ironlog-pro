<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IronLog Pro</title>
    <meta name="description" content="極簡、高效、充滿激勵的健身追蹤 PWA。鋼鐵般的意志，數位化的記錄。">
    <meta property="og:title" content="IronLog Pro">
    <meta property="og:description" content="極簡、高效、充滿激勵的健身追蹤 PWA。鋼鐵般的意志，數位化的記錄。">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="metadata.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IronLog">
    
    <!-- iOS App Icon -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/P5H3QSkC/Gemini-Generated-Image-38bzpo38bzpo38bz.png">

    <script>
        // Suppress harmless Vite HMR WebSocket disconnects in iframe preview sandbox
        window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }
        });
        window.addEventListener('error', function(event) {
            var msg = (event && (event.message || '')) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }
        });
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            '-apple-system',
                            'BlinkMacSystemFont',
                            '"SF Pro Text"',
                            '"SF Pro Display"',
                            '"SF Pro"',
                            '"PingFang TC"',
                            '"PingFang SC"',
                            'system-ui',
                            '"Helvetica Neue"',
                            'Helvetica',
                            'Arial',
                            'sans-serif'
                        ]
                    }
                }
            }
        };
    </script>
    <style>
        * {
            font-weight: normal !important;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            background-color: #FFFFFF;
            color: #1D1D1F;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "PingFang TC", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        #root {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
        }
        .text-neon-green { color: #82CC00; }
        .bg-neon-green { background-color: #CCFF00; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .glow-green { 
            box-shadow: 0 4px 20px rgba(204, 255, 0, 0.2); 
        }
        .glow-green:active {
            box-shadow: 0 2px 10px rgba(204, 255, 0, 0.3);
        }
        
        ::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
